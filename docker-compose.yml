version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: manutencao_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: manutencao_micro
      MYSQL_USER: apiuser
      MYSQL_PASSWORD: senha123
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
